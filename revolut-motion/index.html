<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Revolut Motion</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#4C7DFF;--violet:#9B6BFF;--pink:#FF5FA8;--cyan:#36D6FF;--green:#2BD47D;--orange:#FF8A3D;--gold:#FFC53D;--red:#FF4D5E;--muted:rgba(255,255,255,.62)}
html,body{background:#000;width:1920px;height:1080px;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#050507;color:#fff;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.disp,.h{font-family:'Inter Display','Inter',sans-serif}
.abs{position:absolute}
.scene{position:absolute;inset:0;visibility:hidden}
.blob{position:absolute;left:0;top:0;width:1500px;height:1500px;border-radius:50%}
#vig{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
#grain{position:absolute;inset:-64px;opacity:.07;mix-blend-mode:overlay;pointer-events:none}
#fade{position:absolute;inset:0;background:#000;opacity:0}
.wipe{position:absolute;top:-40px;height:1160px;width:3200px;left:0;transform-origin:0 50%}

/* type */
.tb{position:absolute;left:160px;top:290px;width:880px}
.label{font-weight:600;font-size:20px;letter-spacing:.22em;text-transform:uppercase;display:flex;align-items:center;gap:14px;margin-bottom:30px}
.label::before{content:'';width:10px;height:10px;border-radius:50%;background:currentColor;box-shadow:0 0 18px currentColor}
.h{font-weight:700;font-size:108px;line-height:1.02;letter-spacing:-.04em}
.wm{display:inline-block;overflow:hidden;vertical-align:top;padding:.14em .03em .16em;margin:-.14em -.03em -.16em}
.wi{display:inline-block}
.sub{font-size:30px;line-height:1.42;color:var(--muted);margin-top:38px;max-width:660px}
.glass{background:linear-gradient(160deg,rgba(44,44,58,.94),rgba(20,20,28,.92));border:1px solid rgba(255,255,255,.13);border-radius:32px;box-shadow:0 40px 100px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}
.chip{display:flex;align-items:center;gap:12px;padding:16px 24px;border-radius:999px;font-size:22px;font-weight:600;white-space:nowrap}
.muted{color:var(--muted)}
.pos{color:var(--green)}

/* scene 1 */
.cword,.cline{left:0;width:1920px;top:420px;text-align:center;font-weight:700;font-size:210px;letter-spacing:-.045em;line-height:1.1}
.cline{font-size:150px;top:450px}
.logo{left:0;width:1920px;top:395px;text-align:center;font-weight:800;font-size:250px;letter-spacing:-.055em;line-height:1}
.logo .ch{display:inline-block}
.ctag{left:0;width:1920px;top:690px;text-align:center;font-size:38px;color:rgba(255,255,255,.72);letter-spacing:-.01em}
.s1dot{left:951px;top:531px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 40px rgba(255,255,255,.8)}
.s1ring{left:860px;top:440px;width:200px;height:200px;border-radius:50%;border:2px solid #fff}
.s1glow{left:310px;top:-110px;width:1300px;height:1300px;border-radius:50%}
.flash{left:0;top:0;width:1920px;height:1080px;background:#fff;opacity:0}

/* phone */
.phone{position:absolute;width:400px;height:840px;border-radius:64px;background:#0b0b0e;padding:11px;box-shadow:0 0 0 2px #34343c,0 0 0 5px #0a0a0c,0 70px 140px rgba(0,0,0,.65),inset 0 0 0 1px rgba(255,255,255,.08)}
.screen{position:relative;width:100%;height:100%;border-radius:53px;overflow:hidden;background:#0c0c11}
.island{position:absolute;top:12px;left:50%;width:118px;height:34px;margin-left:-59px;background:#000;border-radius:20px;z-index:8}
.sbar{position:absolute;top:21px;left:38px;right:30px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:16px;z-index:7}
.ph-bg{position:absolute;left:0;top:0;width:100%;height:520px;background:radial-gradient(120% 70% at 25% 0%,#5B6CFF 0%,#7A3CF0 40%,rgba(30,16,60,0) 78%),linear-gradient(#1b1533,#0c0c11)}
.ph-top{position:absolute;top:66px;left:20px;right:20px;display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#FFB36B,#FF5FA8);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none}
.srch{flex:1;height:40px;border-radius:20px;background:rgba(255,255,255,.15);display:flex;align-items:center;gap:8px;padding:0 14px;font-size:15px;color:rgba(255,255,255,.78)}
.ib{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex:none}
.ph-bal{position:absolute;top:142px;left:0;right:0;text-align:center}
.acc{font-size:15px;color:rgba(255,255,255,.82)}
.amt{margin-top:6px;font-family:'Inter Display';font-weight:700;font-size:58px;letter-spacing:-.035em;white-space:nowrap}
.amt .dec{font-size:32px;letter-spacing:-.02em}
.pill{display:inline-block;margin-top:12px;padding:8px 18px;border-radius:18px;background:rgba(255,255,255,.18);font-size:14px;font-weight:600}
.ph-btns{position:absolute;top:318px;left:14px;right:14px;display:flex;justify-content:space-around}
.pb{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:500}
.pbc{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.17);display:flex;align-items:center;justify-content:center}
.ph-list{position:absolute;top:428px;left:12px;right:12px;bottom:12px;border-radius:28px;background:#17171e;padding:18px 16px;overflow:hidden}
.lh{display:flex;justify-content:space-between;font-size:16px;margin-bottom:8px}
.lh span{color:#7FA2FF;font-weight:600;font-size:14px}
.row{display:flex;align-items:center;gap:12px;height:62px;overflow:hidden}
.ric{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
.rtx{flex:1;display:flex;flex-direction:column;gap:3px;font-size:15.5px;min-width:0}
.rtx b{font-weight:600}
.rtx i{font-style:normal;font-size:13px;color:rgba(255,255,255,.5)}
.ram{font-weight:600;font-size:15.5px;white-space:nowrap}
.ph-notif{position:absolute;top:10px;left:10px;right:10px;height:78px;border-radius:26px;background:rgba(48,48,58,.97);display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:0 20px 40px rgba(0,0,0,.45);z-index:9}
.nic{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#4C7DFF,#9B6BFF);display:flex;align-items:center;justify-content:center;flex:none}
.ntx{flex:1;display:flex;flex-direction:column;gap:2px;font-size:14px;min-width:0}
.ntx b{font-size:15px}
.ntx span{color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-notif i{font-style:normal;font-size:12px;color:rgba(255,255,255,.5);align-self:flex-start;margin-top:16px}
.wdg{width:310px;padding:24px 26px}
.wdg .t{font-size:17px;color:var(--muted)}
.wdg .v{font-family:'Inter Display';font-size:40px;font-weight:700;letter-spacing:-.03em;margin-top:4px}
.bars{display:flex;align-items:flex-end;gap:10px;height:80px;margin-top:16px}
.bars div{flex:1;border-radius:6px;background:linear-gradient(#7FA2FF,#4C7DFF);transform-origin:50% 100%}
.bars div.hi{background:linear-gradient(#FF8FC4,#FF5FA8)}

/* cards */
.ccard{position:absolute;left:0;top:0;width:500px;height:316px;border-radius:28px;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.18);transform-origin:50% 50%}
.ccard .cn{position:absolute;left:34px;top:28px;font-family:'Inter Display';font-weight:800;font-size:34px;letter-spacing:-.05em}
.ccard .cl{position:absolute;right:30px;top:30px;opacity:.9}
.ccard .chipc{position:absolute;left:36px;top:118px;width:62px;height:46px;border-radius:9px;background:linear-gradient(135deg,#f4d58d,#c9a24c 50%,#f1d38a);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.ccard .chipc::after{content:'';position:absolute;inset:10px 16px;border:1.5px solid rgba(0,0,0,.25);border-radius:4px}
.ccard .num{position:absolute;left:36px;bottom:30px;font-size:24px;font-weight:600;letter-spacing:.08em}
.ccard .typ{position:absolute;right:32px;bottom:30px;font-size:19px;font-weight:600;opacity:.92}
.ccard .sheen{position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.38) 50%,rgba(255,255,255,0) 62%);background-size:300% 100%}
.c-std{background:linear-gradient(135deg,#4C7DFF 0%,#8B5CFF 55%,#FF5FA8 100%)}
.c-metal{background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,rgba(0,0,0,.03) 2px 4px),linear-gradient(135deg,#2a2a30 0%,#7a7a84 45%,#2b2b31 70%,#55555e 100%)}
.c-virt{background:linear-gradient(135deg,#FF9A3D 0%,#FF4D7A 60%,#C93DFF 100%)}
.ice{position:absolute;inset:0;background:linear-gradient(135deg,rgba(225,242,255,.92),rgba(160,205,255,.72));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#1b3d6e;font-weight:700;font-size:26px;opacity:0}
.tog{display:flex;align-items:center;gap:18px;padding:18px 22px 18px 26px;border-radius:999px;font-size:22px;font-weight:600}
.track{width:68px;height:38px;border-radius:19px;background:rgba(255,255,255,.2);position:relative}
.knob{position:absolute;left:4px;top:4px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.toast{display:flex;align-items:center;gap:16px;padding:20px 26px 20px 20px;border-radius:26px;width:380px}
.toast .tt{flex:1;display:flex;flex-direction:column;gap:4px}
.toast .tt b{font-size:21px}
.toast .tt span{font-size:16px;color:var(--muted)}
.toast .ta{font-size:22px;font-weight:700;white-space:nowrap}
.ripple{position:absolute;width:300px;height:300px;border-radius:50%;border:3px solid rgba(255,255,255,.8)}
.bl{display:flex;align-items:center;gap:16px;font-size:28px;font-weight:500;margin-top:20px}
.bl .ck{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}

/* currencies */
.xcard{width:470px;padding:26px 28px}
.xrow{display:flex;align-items:center;gap:16px;height:84px}
.flag{font-size:44px;line-height:1;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;flex:none}
.xc{flex:1;display:flex;flex-direction:column;gap:2px}
.xc b{font-size:26px}
.xc i{font-style:normal;font-size:16px;color:var(--muted)}
.xval{font-family:'Inter Display';font-size:40px;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
.xsep{position:relative;height:30px;margin:4px 0}
.xsep::before{content:'';position:absolute;left:0;right:0;top:15px;height:1px;background:rgba(255,255,255,.12)}
.xswap{position:absolute;left:50%;top:-6px;margin-left:-21px;width:42px;height:42px;border-radius:50%;background:#2b2b38;border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.xwin{height:84px;overflow:hidden}
.xfoot{margin-top:12px;font-size:16px;color:var(--muted);display:flex;align-items:center;gap:8px}
.xfoot::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.cpill{display:flex;align-items:center;gap:10px;padding:10px 20px 10px 12px;border-radius:999px;font-size:21px;font-weight:600;white-space:nowrap}
.cpill .fl{font-size:28px;line-height:1}

/* send */
.ctr{left:0;width:1920px;text-align:center}
.avt{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Inter Display';font-weight:700;font-size:50px;box-shadow:0 30px 60px rgba(0,0,0,.4),inset 0 0 0 3px rgba(255,255,255,.2)}
.avn{position:absolute;left:-50px;right:-50px;top:168px;text-align:center;font-size:24px;font-weight:600}
.coin{width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE28A,#FFB800 60%,#D98E00);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:36px;color:#7a4b00;box-shadow:0 0 40px rgba(255,190,0,.7)}
.badge{position:absolute;right:-6px;bottom:-6px;width:52px;height:52px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 5px #0d0d12}
.rcpt{width:540px;white-space:nowrap;padding:26px 30px;display:flex;align-items:center;gap:20px}
.rcpt .em{font-size:54px;width:84px;height:84px;border-radius:24px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}
.rcpt b{font-size:28px;display:block}
.rcpt span{font-size:19px;color:var(--muted)}
.rcpt .v{margin-left:auto;font-family:'Inter Display';font-size:38px;font-weight:700}
.savt{width:120px;height:120px;font-size:38px}
.tag{position:absolute;left:-40px;right:-40px;margin:0 auto;width:max-content;top:-58px;padding:8px 16px;border-radius:999px;background:var(--green);color:#04210f;font-weight:700;font-size:20px;white-space:nowrap}

/* savings */
.vault{width:520px;height:660px;padding:40px;display:flex;flex-direction:column;align-items:center}
.vault .vh{display:flex;align-items:center;gap:16px;align-self:stretch}
.vault .vem{font-size:40px;width:72px;height:72px;border-radius:22px;background:rgba(43,212,125,.14);display:flex;align-items:center;justify-content:center}
.vault .vt b{font-size:28px;display:block}
.vault .vt span{font-size:18px;color:var(--muted)}
.ringw{position:relative;width:330px;height:330px;margin-top:40px}
.ringw svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringc b{font-family:'Inter Display';font-size:72px;letter-spacing:-.04em}
.ringc span{font-size:20px;color:var(--muted)}
.vamt{margin-top:34px;font-size:26px;font-weight:600}
.vamt span{color:var(--muted);font-weight:500}
.rchip{width:350px;padding:20px 22px;border-radius:26px;display:flex;align-items:center;gap:14px}
.rchip .e{font-size:30px;width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;flex:none}
.rchip .m{flex:1;display:flex;flex-direction:column;gap:3px}
.rchip .m b{font-size:20px}
.rchip .m span{font-size:16px;color:var(--green);font-weight:600}
.rchip .a{font-size:20px;font-weight:600;color:var(--muted)}
.mcoin{width:40px;height:40px;font-size:20px}

/* invest */
.chart{width:720px;padding:32px 34px}
.chart .ct{display:flex;justify-content:space-between;align-items:flex-start}
.chart .nm{font-size:20px;color:var(--muted)}
.chart .pr{font-family:'Inter Display';font-size:56px;font-weight:700;letter-spacing:-.035em;margin-top:4px}
.chart .pc{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:6px 12px;border-radius:12px;background:rgba(43,212,125,.15);color:var(--green);font-weight:700;font-size:19px}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.07);border-radius:14px;padding:5px;position:relative}
.tabs span{position:relative;z-index:1;width:56px;text-align:center;padding:8px 0;font-size:17px;font-weight:600;color:var(--muted)}
.tabs .hl{position:absolute;left:5px;top:5px;width:56px;height:36px;border-radius:10px;background:rgba(255,255,255,.16)}
.assets{width:720px;padding:14px 30px}
.arow{display:flex;align-items:center;gap:16px;height:76px;border-bottom:1px solid rgba(255,255,255,.07)}
.arow:last-child{border-bottom:0}
.arow .ai{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;flex:none}
.arow .an{flex:1;display:flex;flex-direction:column;gap:2px}
.arow .an b{font-size:21px}
.arow .an span{font-size:16px;color:var(--muted)}
.arow .ap{width:110px;text-align:right;font-weight:700;font-size:20px;color:var(--green)}
.bcoin{width:130px;height:130px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:64px;box-shadow:0 30px 60px rgba(0,0,0,.45),inset 0 -8px 0 rgba(0,0,0,.2),inset 0 0 0 6px rgba(255,255,255,.18)}
.foot{left:160px;bottom:56px;font-size:18px;color:rgba(255,255,255,.45)}

/* analytics */
.donutc{width:620px;padding:40px 44px}
.donutw{position:relative;width:380px;height:380px;margin:0 auto}
.donutw svg{position:absolute;inset:0;transform:rotate(-90deg)}
.donutw .dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donutw .dc b{font-family:'Inter Display';font-size:64px;letter-spacing:-.04em}
.donutw .dc span{font-size:19px;color:var(--muted)}
.leg{margin-top:28px}
.leg div{display:flex;align-items:center;gap:14px;height:44px;font-size:20px}
.leg i{width:14px;height:14px;border-radius:50%;flex:none}
.leg span{flex:1}
.leg b{font-weight:600}
.budget{width:620px;padding:26px 30px}
.budget .bt{display:flex;justify-content:space-between;font-size:21px}
.budget .bt span{color:var(--muted)}
.btrack{height:16px;border-radius:8px;background:rgba(255,255,255,.1);margin-top:16px;overflow:hidden}
.bfill{height:100%;border-radius:8px;background:linear-gradient(90deg,#FFC53D,#FF8A3D);transform-origin:0 50%}

/* rewards */
.pts{width:560px;height:560px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,rgba(255,197,61,.28),rgba(255,138,61,.08) 60%,rgba(255,255,255,.03));border:1px solid rgba(255,197,61,.35);box-shadow:0 0 120px rgba(255,170,40,.25)}
.pts b{font-family:'Inter Display';font-size:150px;letter-spacing:-.05em;line-height:1}
.pts span{font-size:28px;color:rgba(255,230,180,.85);margin-top:8px;font-weight:600}
.spark{position:absolute;width:14px;height:14px;border-radius:50%;background:#FFD66B;box-shadow:0 0 14px #FFB800}
.co{width:500px;padding:32px}
.co .pi{height:210px;border-radius:24px;background:linear-gradient(135deg,#2E3A8C,#9B6BFF);display:flex;align-items:center;justify-content:center;font-size:110px}
.co .pn{display:flex;justify-content:space-between;margin-top:24px;font-size:26px;font-weight:600}
.co .ps{display:flex;justify-content:space-between;margin-top:10px;font-size:19px;color:var(--muted)}
.co hr{border:0;height:1px;background:rgba(255,255,255,.1);margin:22px 0}
.rpay{position:relative;height:72px;border-radius:999px;background:#fff;color:#0a0a0f;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;overflow:hidden}
.rpay .lbl,.rpay .spin,.rpay .done{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px}
.cursor{width:56px;height:56px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.25);box-shadow:0 6px 20px rgba(0,0,0,.4)}

/* everyone */
.tile{width:500px;height:440px;padding:40px;border-radius:40px;display:flex;flex-direction:column}
.tile .ti{width:96px;height:96px;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:52px}
.tile .tk{margin-top:auto;font-size:19px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.tile b{font-family:'Inter Display';font-size:46px;letter-spacing:-.035em;margin-top:10px}
.tile p{font-size:22px;line-height:1.4;color:rgba(255,255,255,.72);margin-top:12px}
.plan{width:290px;text-align:center}
.plan .ccard{position:relative;width:290px;height:183px;border-radius:18px}
.plan .ccard .cn{left:20px;top:16px;font-size:22px}
.plan .ccard .chipc{left:20px;top:70px;width:40px;height:30px;border-radius:6px}
.plan .ccard .chipc::after{inset:7px 11px}
.plan b{display:block;margin-top:24px;font-size:30px;font-family:'Inter Display';letter-spacing:-.02em}
.c-plus{background:linear-gradient(135deg,#1ec8ff,#4C7DFF 70%)}
.c-prem{background:linear-gradient(135deg,#1c2556,#3e4fb3 55%,#8a6bff)}
.c-ultra{background:linear-gradient(135deg,#f3f3f6,#c9c9d2 45%,#f6f6f8 70%,#b9b9c4);color:#15151b}

/* outro */

<body>

</div>
<script>
'use strict';
// ------------------------------------------------------------------ helpers
const W=1920,H=1080;
const stage=document.getElementById('stage');
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const L=(a,b,k)=>a+(b-a)*k;
const E={
  lin:k=>k,
  outCubic:k=>1-Math.pow(1-k,3),
  inCubic:k=>k*k*k,
  inOutCubic:k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,
  outExpo:k=>k>=1?1:1-Math.pow(2,-10*k),
  inExpo:k=>k<=0?0:Math.pow(2,10*k-10),
  inOutExpo:k=>k<=0?0:k>=1?1:k<.5?Math.pow(2,20*k-10)/2:(2-Math.pow(2,-20*k+10))/2,
  outBack:k=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)},
  outQuint:k=>1-Math.pow(1-k,5),
  inQuad:k=>k*k,
};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const de2=v=>v.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const de0=v=>Math.round(v).toLocaleString('de-DE');
function tf(el,o){
  let s='';
  if(o.per) s+=`perspective(${o.per}px) `;
  s+=`translate3d(${(o.x||0).toFixed(2)}px,${(o.y||0).toFixed(2)}px,${o.z||0}px)`;
  if(o.rx) s+=` rotateX(${o.rx.toFixed(3)}deg)`;
  if(o.ry) s+=` rotateY(${o.ry.toFixed(3)}deg)`;
  if(o.r) s+=` rotate(${o.r.toFixed(3)}deg)`;
  const sc=o.s===undefined?1:o.s;
  if(sc!==1) s+=` scale(${Math.max(0,sc).toFixed(4)})`;
  el.style.transform=s;
  if(o.op!==undefined) el.style.opacity=clamp(o.op).toFixed(3);
  if(o.blur!==undefined) el.style.filter=o.blur>0.1?`blur(${o.blur.toFixed(2)}px)`:'none';
}
// fade + rise in, fall away out
function fadeUp(el,t,a,b,{d=0.9,dy=40,blur=10,od=0.45,oy=-30,x=0}={}){
  const i=E.outExpo(P(t,a,a+d)),o=b==null?0:E.inCubic(P(t,b,b+od));
  tf(el,{x,y:(1-i)*dy+o*oy,op:i*(1-o),blur:(1-i)*blur+o*blur*0.6});
}
// scale pop in, shrink out
function pop(el,t,a,b,{d=0.6,od=0.4,x=0,y=0,r=0,s0=0.6}={}){
  const i=E.outBack(P(t,a,a+d)),f=P(t,a,a+d*0.5),o=b==null?0:E.inCubic(P(t,b,b+od));
  tf(el,{x,y,r,s:L(s0,1,i)*(1-o*0.3),op:Math.min(f*2,1)*(1-o),blur:o*8});
}
// masked word reveal
function words(el,t,a,b,{st=0.06,d=0.9,ost=0.025,od=0.42}={}){
  $$('.wi',el).forEach((w,i)=>{
    const k=E.outExpo(P(t,a+i*st,a+i*st+d));
    const o=b==null?0:E.inCubic(P(t,b+i*ost,b+i*ost+od));
    w.style.transform=`translateY(${((1-k)*140-o*140).toFixed(2)}%) rotate(${((1-k)*3).toFixed(2)}deg)`;
  });
}
function hl(lines){return lines.map(l=>l.split(' ').map(w=>`<span class="wm"><span class="wi">${w}</span></span>`).join(' ')).join('<br>');}
function letters(s){return [...s].map(c=>`<span class="ch">${c}</span>`).join('');}
function bez(a,c,b,s){const u=1-s;return [u*u*a[0]+2*u*s*c[0]+s*s*b[0],u*u*a[1]+2*u*s*c[1]+s*s*b[1]];}

const IC={

  check:'<path d="M5 12.5l4.5 4.5L19 7"/>',

  bell:'<path d="M6 9a6 6 0 0112 0c0 6.5 2.5 8 2.5 8h-17S6 15.5 6 9z"/><path d="M10.2 20.5a2 2 0 003.6 0"/>',
  card:'<rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19"/>',
  chart:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',

  nfc:'<path d="M8.5 8.5a5 5 0 010 7M12 6a8.5 8.5 0 010 12M15.5 3.5a12 12 0 010 17"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/>',
  send:'<path d="M21 3L10 14"/><path d="M21 3l-6.5 18-4.5-7-7-4.5z"/>',
  jar:'<path d="M7 4h10M8 4v2.5c-2 1-3 2.6-3 5V18a2 2 0 002 2h10a2 2 0 002-2v-6.5c0-2.4-1-4-3-5V4"/><path d="M9 13h6"/>',
  star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9.5C7.5 20 4 17 4 12V6z"/><path d="M8.5 12l2.5 2.5 4.5-4.5"/>',
  pie:'<path d="M12 3v9h9a9 9 0 11-9-9z"/><path d="M15 3.5A9 9 0 0120.5 9H15z"/>',
  bag:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 016 0v2"/>',
};
const icon=(n,s=24,w=2,c='currentColor')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const sbar=()=>`<div class="sbar"><span>9:41</span><span style="display:flex;gap:6px;align-items:center"><svg width="19" height="12" viewBox="0 0 19 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" opacity=".5"/><rect x="2.5" y="2.5" width="17" height="8" rx="2" fill="#fff"/><rect x="25" y="4.5" width="1.6" height="4" rx=".8" fill="#fff" opacity=".5"/></svg></span></div>`;
const cardHTML=(cls,typ,num)=>`<div class="ccard ${cls}"><div class="cn">Revolut</div><div class="cl">${icon('nfc',34,2.2)}</div><div class="chipc"></div><div class="num">•••• ${num}</div><div class="typ">${typ}</div><div class="sheen"></div></div>`;
function add(html){stage.insertAdjacentHTML('beforeend',html);}

const scenes=[];
function scene(a,b,id,fn){scenes.push({a,b,el:document.getElementById(id),fn});}

// ------------------------------------------------------------------ background
const BGK=[ // time, three blob colours, intensity
  [0,  [40,40,90],[20,20,40],[30,20,60],0.0],
  [1.5,[40,40,90],[20,20,40],[30,20,60],0.0],
  [8,  [76,110,255],[155,90,255],[54,170,255],0.75],
  [10, [60,96,255],[123,63,242],[31,182,255],0.85],
  [20, [139,77,255],[255,79,160],[58,107,255],0.85],
  [32, [25,195,255],[46,91,255],[16,208,160],0.85],
  [44, [255,95,168],[255,138,61],[155,90,255],0.8],
  [54, [34,212,138],[18,184,200],[60,110,255],0.8],
  [66, [59,107,255],[35,209,139],[123,63,242],0.85],
  [80, [155,90,255],[255,170,61],[60,80,200],0.6],
  [90, [255,197,61],[255,122,61],[255,95,168],0.75],
  [100,[76,125,255],[155,107,255],[255,95,168],0.9],
  [110,[60,96,255],[155,90,255],[54,170,255],0.85],
  [118,[60,96,255],[155,90,255],[54,170,255],0.85],
];
function bgAt(t){
  let i=0;while(i<BGK.length-2&&t>=BGK[i+1][0])i++;
  const A=BGK[i],B=BGK[i+1];
  const k=E.inOutCubic(clamp((t-A[0])/Math.max(0.001,Math.min(2.2,B[0]-A[0]))));
  const mix=(c1,c2)=>c1.map((v,j)=>Math.round(L(v,c2[j],k)));
  return {c:[mix(A[1],B[1]),mix(A[2],B[2]),mix(A[3],B[3])],it:L(A[4],B[4],k)};
}
const blobs=[$('#b0'),$('#b1'),$('#b2')];
function bg(t){
  const {c,it}=bgAt(t);
  const pos=[
    [-350+Math.sin(t*.21)*160, -500+Math.cos(t*.17)*120],
    [ 900+Math.cos(t*.19)*180,  -80+Math.sin(t*.23)*140],
    [ 250+Math.sin(t*.15+2)*200, 260+Math.cos(t*.2+1)*120],
  ];
  const al=[0.55,0.45,0.3];
  blobs.forEach((b,i)=>{
    const [r,g,bb]=c[i];
    b.style.background=`radial-gradient(closest-side,rgba(${r},${g},${bb},${(al[i]*it).toFixed(3)}),rgba(${r},${g},${bb},0))`;
    b.style.transform=`translate(${pos[i][0].toFixed(1)}px,${pos[i][1].toFixed(1)}px)`;
  });
}

add(`<div class="scene" id="s1">
  <div class="abs s1glow" id="s1glow"></div>
  <div class="abs s1dot" id="s1dot"></div>
  <div class="abs s1ring" id="s1ring"></div>
  ${['Bezahlen.','Senden.','Sparen.','Investieren.'].map((w,i)=>`<div class="abs cword" id="s1w${i}">${hl([w])}</div>`).join('')}
  <div class="abs cline disp" id="s1all">${hl(['Alles in einer App.'])}</div>
  <div class="abs logo disp" id="s1logo">${letters('Revolut')}</div>
  <div class="abs ctag" id="s1tag">Die App für dein ganzes Finanzleben.</div>
  <div class="abs flash" id="s1flash"></div>
</div>`);
$$('#s1 .cword').forEach(e=>e.classList.add('disp'));
const S1C=[[76,125,255],[255,95,168],[43,212,125],[155,107,255]];
scene(0,10.6,'s1',t=>{
  const dot=$('#s1dot');
  const beat=t<1.95?Math.exp(-(t%0.5)*7):0;
  const dIn=E.outBack(P(t,0.15,0.6)),dOut=E.inCubic(P(t,1.6,1.95));
  const d2=t>7.6?E.outBack(P(t,7.62,7.95))*(t<8?1:0):0;
  tf(dot,{s:Math.max(dIn*(1-dOut)*(1+beat*0.8),d2*1.4),op:1});
  // glow behind words
  const g=$('#s1glow');
  let gc=[76,125,255],gi=0;
  if(t>=2&&t<6){const i=Math.floor(t-2);gc=S1C[i];gi=0.25+0.55*Math.exp(-(t-2-i)*2.2);}
  else if(t>=6&&t<8){gc=[110,90,255];gi=0.35*E.outCubic(P(t,6,6.5));}
  else if(t>=8){gc=[90,110,255];gi=0.5*(1-E.inCubic(P(t,9.6,10.4)));}
  else gi=0.18*dIn*(1-dOut);
  g.style.background=`radial-gradient(closest-side,rgba(${gc},${gi.toFixed(3)}),rgba(${gc},0))`;
  tf(g,{s:1+0.06*Math.sin(t*3)});
  for(let i=0;i<4;i++){
    const a=2+i,el=$('#s1w'+i),vis=t>a-0.05&&t<a+1.15;
    el.style.display=vis?'block':'none';
    if(vis){words(el,t,a,a+0.8,{d:0.55,od:0.2});tf(el,{s:1.1-0.1*E.outExpo(P(t,a,a+1))});}
  }
  const all=$('#s1all');all.style.display=(t>5.95&&t<7.95)?'block':'none';
  words(all,t,6.0,7.55,{st:0.09,d:0.75,od:0.3});
  // ring burst + flash at 8.0
  const rk=P(t,8,9.3);
  tf($('#s1ring'),{s:L(0.05,9,E.outExpo(rk)),op:t<8?0:(1-rk)*0.9});
  $('#s1flash').style.opacity=t<8?0:(0.5*(1-E.outCubic(P(t,8,8.4)))).toFixed(3);
  // logo
  const logo=$('#s1logo');
  logo.style.letterSpacing=`${L(0.06,-0.055,E.outExpo(P(t,8,9.6))).toFixed(4)}em`;
  $$('.ch',logo).forEach((c,i)=>{const k=E.outExpo(P(t,8+i*0.04,9.1+i*0.04));tf(c,{y:(1-k)*90,op:k,blur:(1-k)*14});});
  const lo=E.inExpo(P(t,9.75,10.5));
  tf(logo,{s:1+0.03*P(t,8,9.75)+lo*1.6,op:1-lo,blur:lo*18});
  fadeUp($('#s1tag'),t,8.55,9.7,{od:0.4});
});

function fmtBal(v){const s=de2(v),[a,b]=s.split(',');return `${a}<span class="dec">,${b} €</span>`;}
scene(10,20.6,'s2',t=>{
  const i=E.outExpo(P(t,10.0,11.5)),mv=E.inOutCubic(P(t,11.7,12.9)),o=E.inExpo(P(t,19.25,20.3));
  tf($('#ph1'),{per:2000,x:380*mv-260*o,y:(1-i)*950+Math.sin(t*1.3)*7-o*1150,rx:(1-i)*45+o*28,ry:-14*mv*(1-o),r:(1-i)*-6,s:0.9+0.1*i});

add(`<div class="scene" id="s3">
  <div class="tb" style="top:260px">
    <div class="label" style="color:#FF8FC4" id="s3l">Karten</div>

{const g=$('#grain'),c=g.getContext('2d'),im=c.createImageData(320,320),r=mulberry(42);for(let i=0;i<im.data.length;i+=4){const v=Math.floor(r()*255);im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}c.putImageData(im,0,0);
